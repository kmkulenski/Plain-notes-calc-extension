<!doctype html>
<html lang="bg">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Plain Tabs Notes</title>
    <link rel="stylesheet" href="app.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand" aria-label="Plain Tabs Notes" data-i18n-aria="brand.name">
          <img src="icons/icon32.png" alt="" width="24" height="24">
          <span class="brand-text" data-i18n="brand.name">Plain Tabs Notes</span>
        </div>

        <div class="toolbar" aria-label="Note tools" data-i18n-aria="aria.noteTools">
          <button type="button" class="icon-button tool-button" id="toggleCalcButton" title="Toggle calculator" aria-label="Toggle calculator" data-i18n-title="title.calc" data-i18n-aria="title.calc">123</button>
          <button type="button" class="icon-button tool-button" id="importButton" title="Import text file" aria-label="Import text file" data-i18n-title="title.open" data-i18n-aria="title.open">&#8593;</button>
          <button type="button" class="icon-button tool-button" id="printButton" title="Print active note" aria-label="Print active note" data-i18n-title="title.print" data-i18n-aria="title.print">&#9113;</button>
          <select id="languageSelect" class="language-select" title="Interface language" aria-label="Interface language" data-i18n-title="title.language" data-i18n-aria="title.language">
            <option value="bg">BG</option>
            <option value="en">EN</option>
          </select>
          <select id="formatSelect" class="format-select" title="Export format" aria-label="Export format" data-i18n-title="title.format" data-i18n-aria="title.format">
            <option value="txt">.txt</option>
            <option value="md">.md</option>
            <option value="js">.js</option>
            <option value="py">.py</option>
            <option value="html">.html</option>
          </select>
          <button type="button" class="icon-button primary-button" id="exportButton" title="Export active note" aria-label="Export active note" data-i18n-title="title.export" data-i18n-aria="title.export">&#8595;</button>
          <button type="button" class="icon-button close-panel-button" id="minimizeButton" title="Close panel" aria-label="Close panel">&#215;</button>
        </div>
      </header>

      <main class="workspace">
        <section class="notes-pane" aria-label="Notes" data-i18n-aria="aria.notes">
          <div class="tabs-strip">
            <div class="tabs-header">
              <span id="tabsCount">0/10</span>
              <button type="button" class="icon-button small" id="addTabButton" title="New note tab" data-i18n-title="title.newTab">+</button>
            </div>

            <div class="tabs-list" id="tabsList" role="tablist" aria-label="Note tabs" data-i18n-aria="aria.noteTabs"></div>
          </div>

          <section class="editor-pane" aria-label="Active note" data-i18n-aria="aria.activeNote">
            <div class="editor-header">
              <input id="noteTitleInput" class="title-input" type="text" maxlength="80" autocomplete="off" spellcheck="false" aria-label="Note title" data-i18n-aria="aria.noteTitle">
              <details class="tab-menu" id="tabActionsMenu">
                <summary class="icon-button small tab-menu-trigger" title="Tab actions" aria-label="Tab actions" data-i18n-title="aria.tabActions" data-i18n-aria="aria.tabActions">&#8942;</summary>
                <div class="tab-actions" aria-label="Tab actions" data-i18n-aria="aria.tabActions">
                  <button type="button" id="duplicateTabButton" title="Duplicate active tab" data-i18n="button.copy" data-i18n-title="title.copy">Copy</button>
                  <button type="button" id="clearTabButton" title="Clear active note" data-i18n="button.clear" data-i18n-title="title.clear">Clear</button>
                </div>
              </details>
            </div>
            <textarea id="noteContentInput" class="note-content" spellcheck="false" aria-label="Note content" data-i18n-aria="aria.noteContent"></textarea>
            <footer class="editor-footer">
              <div class="status" id="status" role="status" aria-live="polite">Loading</div>
              <span id="noteMeta" class="note-meta">0 chars / 0 lines</span>
            </footer>
          </section>
        </section>

        <aside class="calculator-pane is-hidden" id="calculatorPane" aria-label="Calculator" data-i18n-aria="aria.calculator">
          <div class="calculator-header">
            <span data-i18n="calculator.title">Calculator</span>
            <button type="button" class="icon-button small" id="closeCalcButton" title="Close calculator" data-i18n-title="title.closeCalc">x</button>
          </div>
          <input id="calculatorDisplay" class="calculator-display" type="text" readonly value="0" aria-label="Calculator display" data-i18n-aria="aria.calculatorDisplay">
          <div class="calculator-grid" aria-label="Calculator buttons" data-i18n-aria="aria.calculatorButtons">
            <button type="button" data-calc="clear">C</button>
            <button type="button" data-calc="back" aria-label="Back" data-i18n-aria="calculator.back">&#9003;</button>
            <button type="button" data-calc="percent">%</button>
            <button type="button" data-calc="divide">/</button>
            <button type="button" data-calc="7">7</button>
            <button type="button" data-calc="8">8</button>
            <button type="button" data-calc="9">9</button>
            <button type="button" data-calc="multiply">*</button>
            <button type="button" data-calc="4">4</button>
            <button type="button" data-calc="5">5</button>
            <button type="button" data-calc="6">6</button>
            <button type="button" data-calc="subtract">-</button>
            <button type="button" data-calc="1">1</button>
            <button type="button" data-calc="2">2</button>
            <button type="button" data-calc="3">3</button>
            <button type="button" data-calc="add">+</button>
            <button type="button" data-calc="0">0</button>
            <button type="button" data-calc="decimal">.</button>
            <button type="button" data-calc="sign">+/-</button>
            <button type="button" data-calc="equals">=</button>
          </div>
        </aside>
      </main>
    </div>

    <section class="print-document" id="printDocument" aria-hidden="true">
      <h1 id="printTitle"></h1>
      <pre id="printBody"></pre>
    </section>

    <input id="fileInput" type="file" hidden accept=".txt,.md,.markdown,.js,.py,.html,.htm,.css,.json,.csv,.log,text/*">
    <script src="app.js"></script>
  </body>
</html>
